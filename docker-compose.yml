version: '3.8'

services:
  sgrh-immunopredict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgrh_immunopredict_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
